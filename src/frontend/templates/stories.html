<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate User Stories</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body>
    <div class="window-frame">
        <div class="title-bar">
            <div class="title-text">User Stories Dashboard</div>
            <button class="btn btn-dashboard" onclick="goToMainPage()"
                title="Go back to main page to generate new stories">
                <span class="btn-icon">🏠</span>
                <span class="btn-text">Dashboard</span>
            </button>
            <div class="window-controls">
                <div class="control-btn minimize"></div>
                <div class="control-btn maximize"></div>
                <div class="control-btn close"></div>
            </div>
        </div>
        <div class="main-layout">
            <div class="sidebar">
                <h2 class="sidebar-header">User Stories</h2>
                <div id="githubIntegrationPanel" style="padding: 0 12px 8px 12px; margin-bottom: 8px; font-size: 12px; border-bottom: 1px solid #eee;">
                    <div id="githubStatus" style="margin-bottom: 6px; color: #666;">GitHub: Not connected</div>
                    <div id="githubConnectButtons" style="display: flex; gap: 6px; margin-bottom: 6px;">
                        <button class="btn" style="flex: 1; padding: 6px; font-size: 12px; background: #f0f0f0;"
                            onclick="connectGitHub()">Connect GitHub</button>
                    </div>
                    <div id="githubManageButtons" style="display: none; gap: 6px; margin-bottom: 6px;">
                        <button class="btn" style="flex: 1; padding: 6px; font-size: 12px; background: #e7f3ff; color: #0066cc;"
                            onclick="toggleGitHubConfig()">Configure</button>
                        <button class="btn" style="flex: 1; padding: 6px; font-size: 12px; background: #ffe7e7; color: #cc0000;"
                            onclick="disconnectGitHub()">Disconnect</button>
                    </div>
                    <div id="githubConfigForm" style="display: none;">
                        <input id="githubRepo" type="text" placeholder="Repository (e.g. my-backlog)"
                            style="width: 100%; margin-bottom: 4px; padding: 4px 6px; font-size: 12px;">
                        <input id="githubBranch" type="text" placeholder="Branch (default: main)"
                            style="width: 100%; margin-bottom: 4px; padding: 4px 6px; font-size: 12px;">
                        <input id="githubFolder" type="text" placeholder="Folder (optional, e.g. backlog/)"
                            style="width: 100%; margin-bottom: 4px; padding: 4px 6px; font-size: 12px;">
                        <button class="btn" style="width: 100%; padding: 6px; font-size: 12px; background: #e0e0e0;"
                            onclick="saveGitHubConfig()">Save Config</button>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; margin-bottom: 12px; padding: 0 12px;">
                    <button class="btn" onclick="selectAllStories()"
                        style="flex: 1; padding: 8px; font-size: 13px; background: #f0f0f0;">Select All</button>
                    <button class="btn" onclick="deselectAllStories()"
                        style="flex: 1; padding: 8px; font-size: 13px; background: #f0f0f0;">Deselect All</button>
                </div>
                <ul class="story-list" id="storyList">
                    <!-- Stories will be dynamically generated here -->
                </ul>
                <div style="padding: 12px; border-top: 1px solid #ddd; background: #f9f9f9;">
                    <div style="font-size: 13px; color: #666; margin-bottom: 8px;">
                        <span id="selectedCount">0</span> selected
                    </div>
                    <div class="export-dropdown" style="position: relative; margin-bottom: 10px;">
                        <button class="btn btn-export" onclick="toggleExportDropdown()"
                            style="width: 100%; background-color: #34A853; color: white; padding: 12px; font-size: 14px;">
                            Export Selected ▼
                        </button>
                        <div id="exportMenu" class="export-menu" style="display: none;">
                            <button onclick="exportSelectedToJSON(); toggleExportDropdown();">Export as JSON</button>
                            <button onclick="exportSelectedToWord(); toggleExportDropdown();">Export as Word</button>
                        </div>
                    </div>
                    <button class="btn btn-integrate-all" onclick="integrateSelected()">Integrate Selected</button>
                </div>
            </div>
            <div class="content-panel">
                <div class="story-details" id="storyDetails">
                    <div class="detail-section">
                        <div class="detail-label">Title:</div>
                        <div class="detail-value" id="storyTitle">Select a user story to view details</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">Description:</div>
                        <div class="detail-value" id="storyDescription">-</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">Definition of Done:</div>
                        <div class="detail-value" id="storyDoD">-</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">Test Cases:</div>
                        <div class="detail-value" id="storyTestCases">-</div>
                    </div>
                    <button class="btn btn-integrate" onclick="integrateStory()">Integrate</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/assets/js/multiselect.js"></script>
    <script src="/assets/js/script.js"></script>
</body>

</html>
